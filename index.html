<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Knowledge Graph</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f1117; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; height: 100vh; }
    #graph { width: 100vw; height: 100vh; }

    #tooltip {
      position: fixed;
      background: rgba(20, 22, 30, 0.95);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      max-width: 280px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 100;
      line-height: 1.5;
    }
    #tooltip.visible { opacity: 1; }
    #tooltip .tt-label { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    #tooltip .tt-type { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.6; margin-bottom: 6px; }
    #tooltip .tt-desc { opacity: 0.85; }

    #legend {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(20, 22, 30, 0.85);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 12px;
    }
    #legend h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.5; margin-bottom: 10px; }
    .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

    #controls {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(20, 22, 30, 0.85);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      opacity: 0.7;
    }
    #controls p { margin-bottom: 3px; }

    #stats {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 22, 30, 0.85);
      border: 1px solid #333;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 12px;
      opacity: 0.65;
    }
  </style>
</head>
<body>

<div id="graph"></div>

<div id="tooltip">
  <div class="tt-label"></div>
  <div class="tt-type"></div>
  <div class="tt-desc"></div>
</div>

<div id="legend">
  <h3>Entity type</h3>
  <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div> Person</div>
  <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div> Organisation</div>
  <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div> Country</div>
  <div class="legend-item"><div class="legend-dot" style="background:#a855f7"></div> Event</div>
  <div class="legend-item"><div class="legend-dot" style="background:#64748b"></div> Concept</div>
</div>

<div id="controls">
  <p>Left drag — rotate</p>
  <p>Right drag / scroll — zoom</p>
  <p>Middle drag — pan</p>
  <p>Hover — details</p>
</div>

<div id="stats"></div>

<script type="module">
import ForceGraph3D from 'https://esm.sh/3d-force-graph@1';
import SpriteText from 'https://esm.sh/three-spritetext';
import * as THREE from 'https://esm.sh/three';

const COLOR = {
  person:       "#f97316",
  organisation: "#3b82f6",
  country:      "#22c55e",
  event:        "#a855f7",
  concept:      "#64748b",
};

const LINK_COLOR = {
  causes:          "#ef4444",
  caused_by:       "#f87171",
  threatens:       "#f59e0b",
  opposes:         "#fb923c",
  accuses:         "#fb923c",
  sanctions:       "#fbbf24",
  supports:        "#34d399",
  allies_with:     "#6ee7b7",
  negotiates_with: "#60a5fa",
  involves:        "#94a3b8",
  responds_to:     "#94a3b8",
  impacts:         "#c084fc",
  located_in:      "#4b5563",
  default:         "#475569",
};

function nodeVal(node, links) {
  const degree = links.filter(l => l.source === node.id || l.target === node.id).length;
  return Math.max(4, degree * 2);
}

async function main() {
  let graph;
  try {
    const res = await fetch("graph.json");
    graph = await res.json();
  } catch (e) {
    document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#f87171;font-size:18px;font-family:sans-serif;">
      Could not load graph.json — run <code style="background:#1e2030;padding:2px 6px;border-radius:4px;">pipeline.py</code> first.
    </div>`;
    return;
  }

  const tooltip = document.getElementById("tooltip");

  function showTooltip(e, label, type, desc) {
    tooltip.querySelector(".tt-label").textContent = label;
    tooltip.querySelector(".tt-type").textContent = type.replace(/_/g, " ");
    tooltip.querySelector(".tt-desc").textContent = desc;
    tooltip.classList.add("visible");
    moveTooltip(e);
  }

  function moveTooltip(e) {
    tooltip.style.left = Math.min(e.clientX + 16, window.innerWidth - 300) + "px";
    tooltip.style.top = (e.clientY - 10) + "px";
  }

  function hideTooltip() { tooltip.classList.remove("visible"); }

  const G = ForceGraph3D()(document.getElementById("graph"))
    .backgroundColor("#0f1117")
    .graphData(graph)
    .nodeVal(node => nodeVal(node, graph.links))
    .nodeColor(node => COLOR[node.type] || COLOR.concept)
    .nodeOpacity(0.9)
    .nodeResolution(24)
    .nodeThreeObjectExtend(true)
    .nodeThreeObject(node => {
      const sprite = new SpriteText(node.label);
      sprite.color = "#cccccc";
      sprite.textHeight = 4;
      sprite.material.depthWrite = false;
      sprite.position.y = nodeVal(node, graph.links) * 0.75 + 10;
      return sprite;
    })
    .linkColor(link => LINK_COLOR[link.type] || LINK_COLOR.default)
    .linkOpacity(0.5)
    .linkWidth(1)
    .linkDirectionalParticles(1)
    .linkDirectionalParticleWidth(1.5)
    .linkDirectionalParticleColor(link => LINK_COLOR[link.type] || LINK_COLOR.default)
    .onNodeClick(node => {
      const dist = 120;
      const ratio = 1 + dist / Math.hypot(node.x, node.y, node.z);
      G.cameraPosition(
        { x: node.x * ratio, y: node.y * ratio, z: node.z * ratio },
        node,
        2000
      );
    })
    .onNodeHover((node, e) => {
      document.body.style.cursor = node ? "pointer" : "default";
      if (node) showTooltip(e || { clientX: 0, clientY: 0 }, node.label, node.type, node.description);
      else hideTooltip();
    })
    .onLinkHover((link, e) => {
      document.body.style.cursor = link ? "pointer" : "default";
      if (link) showTooltip(e || { clientX: 0, clientY: 0 }, `${link.source.label} → ${link.target.label}`, link.type, link.description);
      else hideTooltip();
    });

  // Push nodes apart so labels don't overlap
  G.d3Force('charge').strength(-400);
  G.d3Force('link').distance(80);

  // Move tooltip with mouse
  window.addEventListener("mousemove", e => {
    if (tooltip.classList.contains("visible")) moveTooltip(e);
  });

  // 3D header — canvas texture on a plane, sits above the graph cloud
  const titleCanvas = document.createElement('canvas');
  titleCanvas.width = 1024;
  titleCanvas.height = 160;
  const ctx = titleCanvas.getContext('2d');

  // Glowing text
  ctx.clearRect(0, 0, 1024, 160);
  ctx.font = 'bold 80px -apple-system, BlinkMacSystemFont, sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#60a5fa';
  ctx.shadowBlur = 30;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('News Knowledge Graph', 512, 110);

  const titleTex = new THREE.CanvasTexture(titleCanvas);
  const titleMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(350, 55),
    new THREE.MeshBasicMaterial({ map: titleTex, transparent: true, depthWrite: false, side: THREE.DoubleSide })
  );
  titleMesh.position.set(0, 225, 0);
  G.scene().add(titleMesh);

  // 3D sub-header — last feed timestamp
  if (graph.generated_at) {
    const ts = new Date(graph.generated_at).toLocaleString(undefined, {
      dateStyle: 'medium', timeStyle: 'short'
    });
    const subCanvas = document.createElement('canvas');
    subCanvas.width = 1024;
    subCanvas.height = 100;
    const sctx = subCanvas.getContext('2d');
    sctx.font = 'bold 42px Arial, sans-serif';
    sctx.textAlign = 'center';
    sctx.fillStyle = '#94a3b8';
    sctx.fillText(`Last updated: ${ts}`, 512, 64);
    const subTex = new THREE.CanvasTexture(subCanvas);
    const subMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(350, 35),
      new THREE.MeshBasicMaterial({ map: subTex, transparent: true, depthWrite: false, side: THREE.DoubleSide })
    );
    subMesh.position.set(0, 168, 0);
    G.scene().add(subMesh);
  }

  // Stats
  document.getElementById("stats").textContent =
    `${graph.nodes.length} entities · ${graph.links.length} relationships`;

  // Resize
  window.addEventListener("resize", () => {
    G.width(window.innerWidth);
    G.height(window.innerHeight);
  });

  // Intro spin — starts after simulation settles so nodes are spread out
  G.onEngineStop(() => {
    // Find the top 30% of nodes by degree and zoom to their cluster
    const degree = {};
    graph.links.forEach(l => {
      const s = l.source.id ?? l.source;
      const t = l.target.id ?? l.target;
      degree[s] = (degree[s] || 0) + 1;
      degree[t] = (degree[t] || 0) + 1;
    });
    const sorted = Object.values(degree).sort((a, b) => b - a);
    const threshold = sorted[Math.floor(sorted.length * 0.3)] || 1;
    G.zoomToFit(600, 60, node => (degree[node.id] || 0) >= threshold);
  });
}

main();
</script>
</body>
</html>
