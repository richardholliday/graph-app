<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News Knowledge Graph</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1117;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      height: 100vh;
    }

    #canvas { width: 100vw; height: 100vh; }

    /* Links */
    .link {
      stroke-opacity: 0.45;
      stroke-width: 1.5px;
    }
    .link:hover { stroke-opacity: 1; stroke-width: 2.5px; cursor: pointer; }

    /* Nodes */
    .node circle {
      stroke-width: 2px;
      cursor: pointer;
      transition: r 0.15s;
    }
    .node circle:hover { stroke-width: 3px; }
    .node text {
      font-size: 11px;
      fill: #ccc;
      pointer-events: none;
      text-shadow: 0 1px 3px #000, 0 0 6px #000;
    }

    /* Tooltip */
    #tooltip {
      position: fixed;
      background: rgba(20, 22, 30, 0.95);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 13px;
      max-width: 280px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 100;
      line-height: 1.5;
    }
    #tooltip.visible { opacity: 1; }
    #tooltip .tt-label { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    #tooltip .tt-type {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.6;
      margin-bottom: 6px;
    }
    #tooltip .tt-desc { opacity: 0.85; }

    /* Legend */
    #legend {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(20, 22, 30, 0.85);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 14px 16px;
      font-size: 12px;
    }
    #legend h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.5; margin-bottom: 10px; }
    .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

    /* Controls */
    #controls {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(20, 22, 30, 0.85);
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      opacity: 0.7;
    }
    #controls p { margin-bottom: 3px; }

    /* Stats bar */
    #stats {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 22, 30, 0.85);
      border: 1px solid #333;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 12px;
      opacity: 0.65;
    }
  </style>
</head>
<body>

<svg id="canvas"></svg>

<div id="tooltip">
  <div class="tt-label"></div>
  <div class="tt-type"></div>
  <div class="tt-desc"></div>
</div>

<div id="legend">
  <h3>Entity type</h3>
  <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div> Person</div>
  <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div> Organisation</div>
  <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div> Country</div>
  <div class="legend-item"><div class="legend-dot" style="background:#a855f7"></div> Event</div>
  <div class="legend-item"><div class="legend-dot" style="background:#64748b"></div> Concept</div>
</div>

<div id="controls">
  <p>Scroll — zoom</p>
  <p>Drag — pan / move node</p>
  <p>Hover — details</p>
</div>

<div id="stats" id="stats"></div>

<script>
const COLOR = {
  person:       "#f97316",
  organisation: "#3b82f6",
  country:      "#22c55e",
  event:        "#a855f7",
  concept:      "#64748b",
};

const LINK_COLOR = {
  causes:          "#ef4444",
  caused_by:       "#f87171",
  threatens:       "#f59e0b",
  opposes:         "#fb923c",
  accuses:         "#fb923c",
  sanctions:       "#fbbf24",
  supports:        "#34d399",
  allies_with:     "#6ee7b7",
  negotiates_with: "#60a5fa",
  involves:        "#94a3b8",
  responds_to:     "#94a3b8",
  impacts:         "#c084fc",
  located_in:      "#4b5563",
  default:         "#475569",
};

function nodeRadius(d, links) {
  const degree = links.filter(l => l.source.id === d.id || l.target.id === d.id).length;
  return Math.max(6, Math.min(20, 6 + degree * 1.4));
}

async function main() {
  let graph;
  try {
    const res = await fetch("graph.json");
    graph = await res.json();
  } catch (e) {
    document.body.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#f87171;font-size:18px;font-family:sans-serif;">
      Could not load graph.json — run <code style="background:#1e2030;padding:2px 6px;border-radius:4px;">pipeline.py</code> first, then serve with <code style="background:#1e2030;padding:2px 6px;border-radius:4px;">python -m http.server 8000</code>
    </div>`;
    return;
  }

  const svg = d3.select("#canvas");
  const W = window.innerWidth;
  const H = window.innerHeight;

  const g = svg.append("g");

  // Zoom
  svg.call(d3.zoom().scaleExtent([0.2, 5]).on("zoom", e => g.attr("transform", e.transform)));

  // Simulation
  const simulation = d3.forceSimulation(graph.nodes)
    .force("link", d3.forceLink(graph.links).id(d => d.id).distance(120).strength(0.4))
    .force("charge", d3.forceManyBody().strength(-300))
    .force("center", d3.forceCenter(W / 2, H / 2))
    .force("collision", d3.forceCollide().radius(d => nodeRadius(d, graph.links) + 8));

  // Draw links
  const link = g.append("g").selectAll("line")
    .data(graph.links)
    .join("line")
    .attr("class", "link")
    .attr("stroke", d => LINK_COLOR[d.type] || LINK_COLOR.default);

  // Draw nodes
  const node = g.append("g").selectAll("g")
    .data(graph.nodes)
    .join("g")
    .attr("class", "node")
    .call(d3.drag()
      .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on("drag",  (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on("end",   (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; })
    );

  node.append("circle")
    .attr("r", d => nodeRadius(d, graph.links))
    .attr("fill", d => COLOR[d.type] || COLOR.concept)
    .attr("stroke", d => d3.color(COLOR[d.type] || COLOR.concept).brighter(0.8));

  node.append("text")
    .attr("dy", d => nodeRadius(d, graph.links) + 13)
    .attr("text-anchor", "middle")
    .text(d => d.label);

  // Tooltip
  const tooltip = document.getElementById("tooltip");

  function showTooltip(e, d, isLink) {
    const tt = tooltip;
    if (isLink) {
      tt.querySelector(".tt-label").textContent = `${d.source.label} → ${d.target.label}`;
      tt.querySelector(".tt-type").textContent = d.type.replace(/_/g, " ");
      tt.querySelector(".tt-desc").textContent = d.description;
    } else {
      tt.querySelector(".tt-label").textContent = d.label;
      tt.querySelector(".tt-type").textContent = d.type;
      tt.querySelector(".tt-desc").textContent = d.description;
    }
    tt.classList.add("visible");
  }

  function moveTooltip(e) {
    const x = e.clientX + 16;
    const y = e.clientY - 10;
    tooltip.style.left = Math.min(x, window.innerWidth - 300) + "px";
    tooltip.style.top = y + "px";
  }

  function hideTooltip() { tooltip.classList.remove("visible"); }

  node.on("mouseover", (e, d) => showTooltip(e, d, false))
      .on("mousemove", moveTooltip)
      .on("mouseout",  hideTooltip);

  link.on("mouseover", (e, d) => showTooltip(e, d, true))
      .on("mousemove", moveTooltip)
      .on("mouseout",  hideTooltip);

  // Tick
  simulation.on("tick", () => {
    link
      .attr("x1", d => d.source.x)
      .attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x)
      .attr("y2", d => d.target.y);

    node.attr("transform", d => `translate(${d.x},${d.y})`);
  });

  // Stats
  document.getElementById("stats").textContent =
    `${graph.nodes.length} entities · ${graph.links.length} relationships`;

  // Resize
  window.addEventListener("resize", () => {
    simulation.force("center", d3.forceCenter(window.innerWidth / 2, window.innerHeight / 2));
    simulation.alpha(0.1).restart();
  });
}

main();
</script>
</body>
</html>
