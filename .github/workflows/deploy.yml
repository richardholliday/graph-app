name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git describe to find tags

      - name: Generate version.json
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || echo "dev")
          SHA=$(git rev-parse --short HEAD)
          echo "{\"version\": \"$VERSION\", \"sha\": \"$SHA\"}" > version.json

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws s3 cp index.html s3://news-knowledge-graph/ --content-type "text/html; charset=utf-8"
          aws s3 cp version.json s3://news-knowledge-graph/ --content-type "application/json" --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp favicon.svg s3://news-knowledge-graph/ --content-type "image/svg+xml" --cache-control "max-age=86400"
          aws s3 cp apple-touch-icon.png s3://news-knowledge-graph/ --content-type "image/png" --cache-control "max-age=86400"
          aws s3 cp og-image.png s3://news-knowledge-graph/ --content-type "image/png" --cache-control "max-age=86400"
          aws s3 cp photo.jpg s3://news-knowledge-graph/ --content-type "image/jpeg" --cache-control "max-age=86400"
          aws s3 cp robots.txt s3://news-knowledge-graph/ --content-type "text/plain" --cache-control "max-age=86400"
          aws s3 cp sitemap.xml s3://news-knowledge-graph/ --content-type "application/xml" --cache-control "max-age=86400"

      - name: Invalidate CloudFront
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3TCZ7VBIYU9VB \
            --paths "/index.html" "/version.json"
